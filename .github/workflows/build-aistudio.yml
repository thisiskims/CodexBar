name: Build CodexBar (AI Studio)
# Build CodexBar with native Google AI Studio provider

on:
  workflow_dispatch:
  push:
    branches: [aistudio-build]

jobs:
  build-macos:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          XCODE_APP=$(ls -d /Applications/Xcode_*.app /Applications/Xcode.app 2>/dev/null | sort -V | tail -n 1 || true)
          if [[ -n "$XCODE_APP" ]]; then
            sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          fi
          xcodebuild -version
          swift --version

      # Stable self-signed identity so macOS keeps Full Disk Access and Keychain grants across builds.
      - name: Import local signing certificate
        env:
          SIGNING_P12: ${{ secrets.CODEXBAR_SIGNING_P12 }}
          SIGNING_P12_PASSWORD: ${{ secrets.CODEXBAR_SIGNING_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/codexbar-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)
          echo "$SIGNING_P12" | base64 --decode > "$RUNNER_TEMP/codexbar-signing.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/codexbar-signing.p12" -k "$KEYCHAIN" -P "$SIGNING_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          rm -f "$RUNNER_TEMP/codexbar-signing.p12"
          IDENTITY=$(security find-identity -p codesigning "$KEYCHAIN" | awk '/"CodexBar Local Signing"/ {print $2; exit}')
          test -n "$IDENTITY"
          echo "CODEXBAR_ADHOC_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "CODEXBAR_ADHOC_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Package CodexBar.app (adhoc)
        env:
          CODEXBAR_SIGNING: adhoc
          CODEXBAR_SKIP_LAUNCH_SMOKE: "1"
        run: |
          chmod +x Scripts/package_app.sh
          ./Scripts/package_app.sh release
          codesign -dr - CodexBar.app 2>&1 | grep -q 'certificate root = H"' || { echo "CodexBar.app is not signed with the local identity" >&2; exit 1; }
          codesign -dr - CodexBar.app 2>&1 | tail -n 1

      - name: Archive CodexBar.app
        run: |
          ditto -c -k --keepParent CodexBar.app CodexBar-AIStudio-arm64.zip

      - name: Upload CodexBar.app artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodexBar-AIStudio-arm64
          path: CodexBar-AIStudio-arm64.zip
          retention-days: 7
